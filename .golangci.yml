version: "2"

linters:
  default: standard
  enable:
    - errorlint      # hata sarma/karşılaştırma hataları (errors.Is/As)
    - gocritic
    - misspell
    - sqlclosecheck  # kapatılmayan Rows/Stmt
    - unconvert
    - unparam
  settings:
    misspell:
      # Yorumlar Türkçe: bazı Türkçe sözcükler İngilizce yazım hatası gibi
      # görünüyor ("adres" → "address", "…mamalı" → "mammal"). Listeye yalnız
      # gerçekten Türkçe olanlar giriyor.
      ignore-rules:
        - adres
        - mamal
        # "paralel" Türkçe'nin kendi yazımı; "parallel"e çevirmek cümleyi
        # bozardı ("GÖVDELERİ paralel koşar").
        - paralel
  exclusions:
    paths:
      - internal/store/db # sqlc üretimi — elle dokunulmaz, lint'lenmez

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - internal/store/db
